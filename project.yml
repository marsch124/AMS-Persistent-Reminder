# XcodeGen spec — run `xcodegen generate`, then open AMSPersistentReminder.xcodeproj.
# iPhone only, portrait.
name: AMSPersistentReminder
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # The version lives here only; the Info.plist reads it from these two.
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "10"
packages:
  # The rules: reminders, ticking off, repeating, quick times, the nudge plan. No screen in it.
  ReminderCore:
    path: Core
  # The shared AMS icon hub, pinned to one commit so a hub change never arrives by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: ff62cd4a0b728a129595b6a7075d0a9cb177f284
targets:
  AMSPersistentReminder:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      # 0.5: the nudge sounds (.caf), at the bundle's top level so a notification finds them by name.
      - path: App/Resources/Sounds
        buildPhase: resources
      # The signed helper shortcut, offered through the share sheet when adding it by link does not work.
      - path: App/Resources/AMS Reminder List.shortcut
        buildPhase: resources
    dependencies:
      - package: ReminderCore
      - package: AMSIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPersistentReminder
        # iPhone only (an iPad build would need all four orientations, upload error 90474).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 0.5 (pick 28): the list is also kept in iCloud's small key-value store.
        CODE_SIGN_ENTITLEMENTS: App/Config/AMSPersistentReminder.entitlements
    info:
      path: App/Config/Info.plist
      properties:
        # Apple refuses its own app names under the icon ("Reminders"); "AMS Reminder" is ours.
        CFBundleDisplayName: AMS Reminder
        CFBundleName: AMS Persistent Reminder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        # The helper shortcut "AMS Reminder List" comes back with amsreminder://shortcuts?names=…
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.AMSPersistentReminder
            CFBundleURLSchemes: [amsreminder]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 0.5: hold the round + and say the reminder (pick: speak a new reminder).
        NSMicrophoneUsageDescription: "So you can say a new reminder: hold the round + and speak."
        NSSpeechRecognitionUsageDescription: "Turns what you say into a new reminder."
        # 0.5 (pick 11): start nudging when you arrive at or leave a place.
        NSLocationWhenInUseUsageDescription: "To pick a place for a reminder, such as Home."
        NSLocationAlwaysAndWhenInUseUsageDescription: "So a reminder can start nudging when you arrive at or leave a place, even while the app is closed."
        # 0.5 (pick 17): pick a contact to call (the picker needs no permission; this is for safety).
        NSContactsUsageDescription: "To pick someone to call from a reminder."
  AMSPersistentReminderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSPersistentReminder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPersistentReminderUITests
        TEST_TARGET_NAME: AMSPersistentReminder
schemes:
  AMSPersistentReminder:
    build:
      targets:
        AMSPersistentReminder: all
    test:
      targets:
        - AMSPersistentReminderUITests
        - package: ReminderCore/ReminderCoreTests
