<meta charset="utf-8">
<title>Persistent Reminder Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Persistent Reminder Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Written for AMS Persistent Reminder 0.5.2. Update this tour in the release that changes a taught screen.
   Every pretend-screen class starts with pr- so it can never clash with the engine's own classes. */
:root {
  --bg: #F6F4F2; --panel: #FFFFFF; --fg: #26201D; --muted: #6C625C; --line: #E8E1DC;
  --accent: #B93E1B; --accent-soft: #FCE9E2; --good: #1E7A49; --good-soft: #E3F4E9; --warn: #B4400F;
  --logo: #E8603A; --mainb: #C94A26; --shadow: 0 18px 40px rgba(38,32,29,.2);
  --pbg:#F2F2F7; --pcard:#FFFFFF; --pfg:#1C1C1E; --pmuted:#6E6E73; --pline:#E3E3E8; --pfield:rgba(120,120,128,.14);
  --or:#E8603A; --orf:#E8603A; --bl:#2F7CF6; --pu:#7C4DEB; --gr:#24985D; --wait:#FFF2EC; --teal:#14808A; --red:#D8343A;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#171210; --panel:#221B18; --fg:#F2ECE8; --muted:#B0A39B; --line:#382D28;
  --accent:#FF9E80; --accent-soft:#3A241B; --good:#7FDCA4; --good-soft:#16301F; --warn:#FFB38A; --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#000000; --pcard:#1C1C1E; --pfg:#F2F2F7; --pmuted:#98989F; --pline:#38383A; --pfield:rgba(120,120,128,.3);
  --or:#FF8A65; --bl:#5A9BFF; --pu:#A78BFA; --gr:#4ADE80; --wait:#3A2620; --teal:#5CCCCC; --red:#FF6B6B;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#171210; --panel:#221B18; --fg:#F2ECE8; --muted:#B0A39B; --line:#382D28;
  --accent:#FF9E80; --accent-soft:#3A241B; --good:#7FDCA4; --good-soft:#16301F; --warn:#FFB38A; --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#000000; --pcard:#1C1C1E; --pfg:#F2F2F7; --pmuted:#98989F; --pline:#38383A; --pfield:rgba(120,120,128,.3);
  --or:#FF8A65; --bl:#5A9BFF; --pu:#A78BFA; --gr:#4ADE80; --wait:#3A2620; --teal:#5CCCCC; --red:#FF6B6B;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--logo); color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 66ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: var(--mainb); border-color: var(--mainb); color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

.target { z-index: 2; animation: ring 1.6s ease-in-out infinite; border-radius: 9px }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 6px rgba(230,181,63,.35) } 50% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 11px rgba(230,181,63,0) } }

/* Finish */
.finish { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px }
.finish h3 { font-family: var(--f-display); margin: 0 0 8px; font-size: 19px }
.finish label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer }
.finish input { width: 18px; height: 18px; accent-color: var(--mainb); margin-top: 2px; flex: none }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0,1fr) }
  .rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px }
  .brand { width: 100% }
  .chap .n { display: none }
  .railnote, .bar { width: 100% }
  .coach { grid-template-columns: minmax(0,1fr) }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pfg); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input) { font: inherit; color: var(--pfg); -webkit-user-select: text; user-select: text }
.pr-sbar { height: 34px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 26px 4px; font-weight: 600; font-size: 14px }
.pr-scr { position: absolute; left: 0; right: 0; top: 34px; bottom: 56px; overflow-y: auto; padding: 0 14px 160px; scrollbar-width: none }
.pr-scr::-webkit-scrollbar { display: none }
.pr-h1 { font-size: 28px; font-weight: 700; margin: 6px 4px 8px; line-height: 1.1 }
.pr-gh { font-size: 13px; font-weight: 600; margin: 12px 6px 4px; letter-spacing: .01em }
.pr-card { background: var(--pcard); border-radius: 14px; overflow: hidden }
.pr-rowwrap { position: relative; border-top: 1px solid var(--pline); overflow: hidden }
.pr-rowwrap:first-child { border-top: 0 }
.pr-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--pcard); cursor: pointer; transition: transform .2s; min-height: 54px; z-index: 1 }
.pr-row.wait { background: var(--wait) }
.pr-row.col { box-shadow: inset 3px 0 0 var(--rc); }
.pr-row.sl { transform: translateX(-192px) } .pr-row.sr { transform: translateX(128px) }
.pr-mid { flex: 1; min-width: 0 } .pr-t { font-weight: 500; font-size: 15.5px } .pr-n { font-size: 12.5px; color: var(--pmuted) }
.pr-g { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--pmuted) }
.pr-row.wait .pr-g { color: var(--or) }
.pr-time { text-align: right; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--pmuted); background: none; border: 0; padding: 2px 0 2px 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; cursor: pointer }
.pr-acts { position: absolute; top: 0; bottom: 0; display: flex; z-index: 0 }
.pr-acts.r { right: 0 } .pr-acts.l { left: 0 }
.pr-ab { width: 64px; border: 0; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer }
.pr-hint { position: absolute; right: 10px; top: 5px; z-index: 3; border: 1.5px dashed var(--pmuted); border-radius: 8px; background: var(--pcard); font-size: 11px; padding: 1px 7px; color: var(--pmuted); cursor: pointer }
.pr-bottom { position: absolute; left: 0; right: 0; bottom: 56px; padding: 6px 14px 8px; background: linear-gradient(to top, var(--pbg) 78%, transparent); display: flex; flex-direction: column; gap: 8px; z-index: 5 }
.pr-plus { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--orf); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.2); cursor: pointer; flex: none }
.pr-ringb { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--pcard); display: grid; place-items: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,.15); cursor: pointer; flex: none }
.pr-ringb b { position: absolute; color: var(--gr); font-size: 14px }
.pr-bl { display: flex; align-items: center; gap: 10px }
.pr-cap { font-size: 12.5px; color: var(--pmuted); flex: 1 }
.pr-undo { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--pcard); box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 13.5px }
.pr-undo span { flex: 1 } .pr-undo button { border: 0; background: none; color: var(--bl); font-weight: 700; cursor: pointer; padding: 4px 6px }
.pr-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--pcard); border-top: 1px solid var(--pline); display: flex; z-index: 6 }
.pr-tab { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 500; color: var(--pmuted); cursor: pointer }
.pr-tab.on.a { color: var(--or) } .pr-tab.on.b { color: var(--pu) }
.pr-paused { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--pcard); border-radius: 14px; margin-bottom: 8px; font-size: 13.5px }
.pr-paused span { flex: 1 }
.pr-sm { border: 0; border-radius: 14px; background: var(--pu); color: #fff; font-weight: 600; font-size: 13px; padding: 4px 11px; cursor: pointer }
.pr-practice { position: absolute; left: 10px; right: 10px; top: 36px; z-index: 9; background: rgba(255,214,102,.95); color: #3b2c00; border-radius: 10px; padding: 5px 8px; display: flex; gap: 8px; align-items: center; font-size: 12px }
.pr-practice button { border: 1.5px dashed #3b2c00; background: #fff6d6; border-radius: 8px; font-weight: 600; padding: 3px 9px; font-size: 12px; cursor: pointer; color: #3b2c00 }
/* edit page */
.pr-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; font-size: 16px }
.pr-nav b { font-weight: 700; color: var(--bl) }
.pr-cancel { border: 0; background: none; color: var(--bl); cursor: pointer; font-size: 16px; padding: 4px }
.pr-save { border: 0; border-radius: 16px; background: var(--bl); color: #fff; font-weight: 700; font-size: 15px; padding: 5px 16px; cursor: pointer }
.pr-field { background: var(--pcard); border-radius: 12px; padding: 11px 14px; font-size: 17px; font-weight: 500; width: 100%; border: 0; outline: 0; display: block }
.pr-hd { font-size: 13px; font-weight: 700; margin: 13px 4px 5px }
.pr-chips { display: flex; flex-wrap: wrap; gap: 6px }
.pr-chip { border: 0; border-radius: 15px; padding: 6px 12px; font-size: 14px; background: color-mix(in srgb, var(--cc, var(--bl)) 14%, transparent); color: var(--cc, var(--bl)); cursor: pointer; font-weight: 500 }
.pr-chip.on { background: var(--cc, var(--bl)); color: #fff }
.pr-sw { position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; background: rgba(120,120,128,.35); cursor: pointer; flex: none }
.pr-sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s }
.pr-sw.on { background: var(--gr) } .pr-sw.on::after { left: 20px }
.pr-swrow { display: flex; align-items: center; gap: 10px; background: var(--pcard); border-radius: 12px; padding: 9px 12px; margin-top: 6px; font-size: 14.5px }
.pr-swrow span { flex: 1 } .pr-small { font-size: 12px; color: var(--pmuted); margin: 3px 6px 0 }
.pr-dots { display: flex; gap: 9px; flex-wrap: wrap; align-items: center }
.pr-dot { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--dc); cursor: pointer; position: relative; display: grid; place-items: center; color: var(--pmuted) }
.pr-dot.on { box-shadow: 0 0 0 2px var(--pcard), 0 0 0 4px var(--dc) }
.pr-days { display: flex; gap: 5px; margin-top: 7px }
.pr-day { width: 36px; height: 34px; border: 0; border-radius: 17px; background: color-mix(in srgb, var(--bl) 14%, transparent); color: var(--bl); font-weight: 600; cursor: pointer }
.pr-day.on { background: var(--bl); color: #fff }
.pr-hours { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 5px }
.pr-hours span { text-align: center; font-size: 12px; padding: 4px 0; border-radius: 8px; background: var(--pcard) } .pr-hours span.on { background: var(--bl); color: #fff }
.pr-heard { font-size: 12.5px; color: var(--bl); margin: 0 4px 6px; font-style: italic }
.pr-pick { border: 0; border-radius: 14px; background: var(--pu); color: #fff; font-weight: 600; font-size: 13px; padding: 4px 12px; cursor: pointer }
.pr-set { display: flex; align-items: center; gap: 10px; background: var(--pcard); padding: 11px 12px; border-top: 1px solid var(--pline); font-size: 15px; cursor: pointer; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left }
.pr-set:first-child { border-top: 0 } .pr-set .sp { flex: 1 } .pr-set .v { color: var(--pmuted) }
.pr-st { font-size: 13px; font-weight: 700; margin: 14px 6px 4px }
.pr-pg { padding: 4px 4px 0 } .pr-pg h3 { margin: 12px 0 3px; font-size: 13px; color: var(--bl) } .pr-pg p { margin: 2px 0; font-size: 13px }
/* done page */
.pr-hero { display: flex; gap: 14px; align-items: center; background: var(--pcard); border-radius: 14px; padding: 12px 14px }
.pr-hero b { display: block; font-size: 17px; color: var(--gr) } .pr-hero span { font-size: 13px; color: var(--pmuted); white-space: pre-line }
/* nudge card */
.pr-lock { position: absolute; inset: 0; z-index: 20; background: linear-gradient(160deg, #3a4a7a, #7a4a6a); padding: 70px 14px 0; display: flex; flex-direction: column; align-items: center; gap: 8px }
.pr-lock .clock { color: #fff; font-size: 62px; font-weight: 300; margin-bottom: 18px }
.pr-notif { width: 100%; background: rgba(255,255,255,.88); color: #1c1c1e; border-radius: 18px; padding: 10px 12px; font-size: 14px; cursor: pointer }
.pr-notif small { color: #55555a; display: flex; justify-content: space-between } .pr-notif b { display: block; font-size: 15px; margin: 2px 0 }
.pr-nb { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap }
.pr-nb button { flex: 1 1 45%; border: 0; border-radius: 10px; background: rgba(60,60,67,.14); padding: 7px 4px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: #1c1c1e }
.pr-nb button.d { background: var(--gr); color: #fff }
.pr-menu { position: absolute; left: 14px; right: 14px; bottom: 70px; z-index: 12; background: var(--pcard); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.35); padding: 6px }
.pr-menu b { display: block; font-size: 13px; padding: 6px 10px; color: var(--pmuted) }
.pr-menu button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 10px; font-size: 16px; border-radius: 10px; cursor: pointer }
.pr-menu button:hover { background: var(--pfield) }
.pr-toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: #1c1c1e; color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 13px; z-index: 30; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis }
@media (min-width: 1020px) {
  .main { grid-template-columns: minmax(0,1fr) 402px; align-items: start }
  .topnote, .finish { grid-column: 1 / -1 }
  .coach { grid-column: 1; grid-row: 2; grid-template-columns: minmax(0,1fr); position: sticky; top: 16px }
  .stagebox { grid-column: 2; grid-row: 2 }
}
</style>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Chapters"></nav>
  <main class="main">

    <div class="stagebox" id="stagebox"><div class="stage" id="stage"></div></div>
    <section class="finish" id="finish" hidden></section>
  </main>
</div>

    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon(FINAL_ICON)}<span>${FINAL_LABEL}</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">${RAILNOTE}</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers();
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set(KEY + '-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  let ticks = JSON.parse(store.get(KEY + '-real') || '[]');
  fin.innerHTML = `<h3>${FINISH_TITLE}</h3>${FINISH_ITEMS.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set(KEY + '-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}


const FINISH_ITEMS = ['Open Persistent on your iPhone (type “persistent” in the search). Look for the orange title and the group “Waiting for you”.',
  'Press the orange plus, type something, press “In 10 min” and Save. Then wait for the nudge, press and hold it and press “Done”.',
  'Press and hold the plus and say “remind me tomorrow at 3”. Check the page that opens.',
  'Slide a row to the left and look at Later and Pause. Slide a repeating one to the right and look for Skip.',
  'Press the green ring at the bottom right and read the line under “Nice work!”.',
  'In Settings, look at Quiet hours and the three “later” buttons. Open What’s new.'];
/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.menu) { S.menu = null; renderStage(); return; } if (S.screen === 'edit') { act('cancel'); return; } }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
